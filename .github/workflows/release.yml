name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.6'
          channel: stable
      - run: flutter pub get
      - name: Verify release version and notes
        run: |
          version=$(sed -n 's/^version: \([^+]*\).*/\1/p' pubspec.yaml)
          test "$GITHUB_REF_NAME" = "v$version"
          test -s "docs/releases/$GITHUB_REF_NAME.md"
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub

  build-windows:
    needs: validate
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - locale: en
            suffix: ""
          - locale: ja
            suffix: "-ja"
          - locale: zh
            suffix: "-zh"
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.6'
          channel: stable

      - run: flutter pub get

      - run: flutter build windows --release --dart-define=DEFAULT_LOCALE=${{ matrix.locale }}

      - name: Archive Windows build
        uses: actions/upload-artifact@v4
        with:
          name: windows-build${{ matrix.suffix }}
          path: build/windows/x64/runner/Release/

  build-android:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - locale: en
            suffix: ""
          - locale: ja
            suffix: "-ja"
          - locale: zh
            suffix: "-zh"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.6'
          channel: stable

      - name: Require release signing configuration
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_PASSWORD"
          test -n "$KEY_ALIAS"

      - name: Decode keystore
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > android/app/naiweaver-release.jks

      - name: Write key.properties
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" "naiweaver-release.jks" \
            > android/key.properties

      - run: flutter pub get

      - run: flutter build apk --release --dart-define=DEFAULT_LOCALE=${{ matrix.locale }}

      - name: Archive Android build
        uses: actions/upload-artifact@v4
        with:
          name: android-build${{ matrix.suffix }}
          path: build/app/outputs/flutter-apk/app-release.apk

  build-linux:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      matrix:
        include:
          - locale: en
            suffix: ""
          - locale: ja
            suffix: "-ja"
          - locale: zh
            suffix: "-zh"
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.6'
          channel: stable

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-12-dev libsecret-1-dev libfuse2 curl python3 flatpak flatpak-builder xvfb xauth xdotool dbus-x11 gnome-keyring libgl1-mesa-dri
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive flathub org.gnome.Platform//49 org.gnome.Sdk//49

      - run: flutter pub get

      - name: Build AppImage
        run: |
          chmod +x scripts/build-appimage.sh
          scripts/build-appimage.sh --dart-define=DEFAULT_LOCALE=${{ matrix.locale }}

      - name: Rename AppImage
        if: ${{ matrix.suffix != '' }}
        run: mv NAIWeaver-x86_64.AppImage NAIWeaver${{ matrix.suffix }}-x86_64.AppImage

      - name: Archive Linux build
        uses: actions/upload-artifact@v4
        with:
          name: linux-build${{ matrix.suffix }}
          path: NAIWeaver${{ matrix.suffix }}-x86_64.AppImage

      - name: Build and check Flatpak from the same Linux bundle
        run: bash scripts/build-flatpak.sh "${{ matrix.locale }}"

      - name: Install and launch Flatpak
        run: |
          flatpak install --user --noninteractive build/flatpak/*.flatpak
          timeout 90s dbus-run-session -- xvfb-run -a -s '-screen 0 1280x800x24' bash scripts/smoke-test-flatpak.sh

      - name: Archive Flatpak launch log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flatpak-launch-log-${{ matrix.locale }}
          path: build/flatpak/smoke-test.log
          if-no-files-found: ignore

      - name: Archive Flatpak build
        uses: actions/upload-artifact@v4
        with:
          name: flatpak-build${{ matrix.suffix }}
          path: build/flatpak/NAIWeaver${{ matrix.suffix }}-x86_64.flatpak
          if-no-files-found: error

  build-web:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - locale: en
            suffix: ""
            base_href: "/NAIWeaver/"
          - locale: ja
            suffix: "-ja"
            base_href: "/NAIWeaver/ja/"
          - locale: zh
            suffix: "-zh"
            base_href: "/NAIWeaver/zh/"
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.6'
          channel: stable

      - run: flutter pub get

      - run: flutter build web --release --base-href "${{ matrix.base_href }}" --dart-define=DEFAULT_LOCALE=${{ matrix.locale }}

      - name: Archive Web build
        uses: actions/upload-artifact@v4
        with:
          name: web-build${{ matrix.suffix }}
          path: build/web/

  deploy-web:
    runs-on: ubuntu-latest
    needs: build-web
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web-build
          path: web-build/

      - uses: actions/download-artifact@v4
        with:
          name: web-build-ja
          path: web-build/ja/

      - uses: actions/download-artifact@v4
        with:
          name: web-build-zh
          path: web-build/zh/

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web-build/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  create-release:
    runs-on: ubuntu-latest
    needs: [build-windows, build-android, build-linux, deploy-web]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: windows-build/

      - uses: actions/download-artifact@v4
        with:
          name: windows-build-ja
          path: windows-build-ja/

      - uses: actions/download-artifact@v4
        with:
          name: android-build
          path: android-build/

      - uses: actions/download-artifact@v4
        with:
          name: android-build-ja
          path: android-build-ja/

      - uses: actions/download-artifact@v4
        with:
          name: linux-build
          path: linux-build/

      - uses: actions/download-artifact@v4
        with:
          name: linux-build-ja
          path: linux-build-ja/

      - uses: actions/download-artifact@v4
        with:
          name: windows-build-zh
          path: windows-build-zh/

      - uses: actions/download-artifact@v4
        with:
          name: android-build-zh
          path: android-build-zh/

      - uses: actions/download-artifact@v4
        with:
          name: linux-build-zh
          path: linux-build-zh/

      - name: Zip Windows builds
        run: |
          cd windows-build && zip -r ../NAIWeaver.zip . && cd ..
          cd windows-build-ja && zip -r ../NAIWeaver-ja.zip . && cd ..
          cd windows-build-zh && zip -r ../NAIWeaver-zh.zip . && cd ..

      - uses: actions/download-artifact@v4
        with:
          pattern: flatpak-build*
          path: flatpak-build/
          merge-multiple: true

      - name: Rename APKs
        run: |
          mv android-build/app-release.apk android-build/NAIWeaver.apk
          mv android-build-ja/app-release.apk android-build-ja/NAIWeaver-ja.apk
          mv android-build-zh/app-release.apk android-build-zh/NAIWeaver-zh.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: docs/releases/${{ github.ref_name }}.md
          fail_on_unmatched_files: true
          files: |
            NAIWeaver.zip
            NAIWeaver-ja.zip
            NAIWeaver-zh.zip
            android-build/NAIWeaver.apk
            android-build-ja/NAIWeaver-ja.apk
            android-build-zh/NAIWeaver-zh.apk
            linux-build/NAIWeaver-x86_64.AppImage
            linux-build-ja/NAIWeaver-ja-x86_64.AppImage
            linux-build-zh/NAIWeaver-zh-x86_64.AppImage
            flatpak-build/NAIWeaver-x86_64.flatpak
            flatpak-build/NAIWeaver-ja-x86_64.flatpak
            flatpak-build/NAIWeaver-zh-x86_64.flatpak
